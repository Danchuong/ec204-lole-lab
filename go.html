<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chuyển hướng — Lô lẻ Lab</title>
<meta name="robots" content="noindex,nofollow">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-HLY9DL04PE"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-HLY9DL04PE');
</script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Lora:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E100D;--cream:#F2EFE3;--lime:#C9F24A;--clay:#E4663A;--line:rgba(242,239,227,.14)}
body{margin:0;background:var(--ink);color:var(--cream);font-family:'JetBrains Mono',monospace;font-size:14px;display:grid;place-items:center;min-height:100vh;padding:28px}
.box{max-width:680px;width:100%;border:1px solid var(--line);padding:30px}
h1{font-family:'Lora',serif;font-size:1.5rem;margin:0 0 6px}
table{width:100%;border-collapse:collapse;margin:18px 0;font-size:12.5px}
td{border-bottom:1px dashed var(--line);padding:7px 0;vertical-align:top}
td:first-child{color:var(--lime);width:34%}
a{color:var(--clay)}
.bar{height:3px;background:var(--line);margin-top:20px;overflow:hidden}
.bar i{display:block;height:3px;width:0;background:var(--lime);animation:go 1500ms linear forwards}
@keyframes go{to{width:100%}}
small{color:#8f8c7e;display:block;margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<div class="box">
  <h1>Đang chuyển tới trang chính thức</h1>
  <p id="dest">…</p>
  <table id="params"></table>
  <div class="bar"><i></i></div>
  <small>Trang trung gian của prototype bài tập EC204.R12 — tồn tại để ghi nhận sự kiện click và cho phép kiểm tra tham số UTM còn/mất sau chuyển hướng. Không chuyển tiếp dữ liệu cá nhân. <a href="index.html">← về trang thử nghiệm</a></small>
</div>
<script>
(function(){
  var ALLOW=['anfin.vn','www.anfin.vn'];
  var P=new URLSearchParams(location.search);
  var raw=P.get('to')||'https://anfin.vn/';
  var target;
  try{ target=new URL(raw); }catch(e){ target=new URL('https://anfin.vn/'); }
  if(ALLOW.indexOf(target.hostname)===-1) target=new URL('https://anfin.vn/');
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(function(k){
    if(P.get(k)) target.searchParams.set(k,P.get(k));
  });
  var rows='';
  P.forEach(function(v,k){ if(k!=='to') rows+='<tr><td>'+k+'</td><td>'+v+'</td></tr>'; });
  rows+='<tr><td>ts</td><td>'+new Date().toISOString()+'</td></tr>';
  rows+='<tr><td>referrer</td><td>'+(document.referrer||'(direct)')+'</td></tr>';
  document.getElementById('params').innerHTML=rows;
  document.getElementById('dest').innerHTML='<a href="'+target.toString()+'">'+target.toString()+'</a>';
  try{
    var all=JSON.parse(localStorage.getItem('llab_events')||'[]');
    all.push({ts:new Date().toISOString(),name:'click_out',params:{target:target.toString(),session:sessionStorage.getItem('llab_sid')||'(none)',referrer:document.referrer||'(direct)'}});
    localStorage.setItem('llab_events',JSON.stringify(all.slice(-500)));
  }catch(e){}
  if(window.gtag) window.gtag('event','click_out',{target:target.toString()});
  setTimeout(function(){ location.replace(target.toString()); },1500);
})();
</script>
</body>
</html>
